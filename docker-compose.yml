# docker compose up -d   →   http://localhost:8080
services:
  planly:
    build: .
    # image: planly            # if you built or pulled it separately
    container_name: planly
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - planly-data:/data      # sync documents, one JSON per access code
    environment:
      # restrict sync to specific codes; leave unset to accept any code
      # ALLOWED_CODES: "AAAA-BBBB-CCCC-DDDD"
      TZ: UTC

volumes:
  planly-data:
