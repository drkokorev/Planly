# Planly on your own server: static files + sync API proxied to server/sync-node.js
# Put the contents of dist/ (or the repo root: index.html, sw.js, manifest.json, icons/) into /var/www/planly

server {
    listen 80;
    server_name planly.example.com;          # then: sudo certbot --nginx -d planly.example.com

    root /var/www/planly;
    index index.html;

    # the app shell and the service worker must never be cached by intermediaries,
    # otherwise updates never reach installed home-screen apps
    location = /sw.js         { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /version.txt   { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /icons/          { expires 30d; access_log off; try_files $uri =404; }

    # sync API → node process (systemd unit or pm2). Remove this block if you don't need sync.
    location = /api/sync {
        proxy_pass http://127.0.0.1:8787/api/sync;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        client_max_body_size 2m;
    }

    location / { try_files $uri $uri/ /index.html; }
}
